<section class="card"><div class="header"><h3>Danh sách, hủy chuyến</h3><p-select [options]="trangThaiOptions" optionLabel="label" optionValue="value" [ngModel]="trangThai()" (ngModelChange)="trangThai.set($event);tai()" /></div><app-error-box [loi]="loi()"/><p-table [value]="danhSach()" [loading]="dangTai()" styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{'min-width':'78rem'}"><ng-template #header><tr><th>Mã</th><th>Tuyến</th><th>Xe</th><th>Giờ đi</th><th>Giờ đến</th><th>Lái</th><th>Phụ</th><th>Đã bán</th><th>Trạng thái</th><th></th></tr></ng-template><ng-template #body let-c><tr [class.huy]="c.trangThai==='Huy'"><td><b>{{c.maChuyen}}</b></td><td>{{c.tenTuyen}}</td><td>{{c.bienSo}}</td><td>{{c.gioKhoiHanhDK|vnDate:true}}</td><td>{{c.gioDenDK|vnDate:true}}</td><td>{{c.tenTXLai}}</td><td>{{c.tenTXPhu}}</td><td>{{c.daBan}} / {{c.soCho}}</td><td><p-tag [value]="c.trangThai|trangThai:'chuyen'" [severity]="severity(c.trangThai)"/></td><td>@if(c.trangThai==='KeHoach'){<p-button label="Hủy" icon="pi pi-times" severity="secondary" [text]="true" [loading]="dangHuy()===c.maChuyen" (onClick)="huy(c)"/>}</td></tr></ng-template><ng-template #emptymessage><tr><td colspan="10" class="empty">Không có chuyến phù hợp.</td></tr></ng-template></p-table></section>
