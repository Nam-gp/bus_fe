<section class="readiness">
  <div class="readiness__title">
    Mức độ sẵn sàng vận hành — bấm dòng cảnh báo để tới chỗ cần sửa
    @if (dangTai()) {
      <i class="pi pi-spin pi-spinner"></i>
    }
  </div>
  <div class="readiness__rows">
    @for (d of dong(); track d.nhan) {
      <a class="readiness__row readiness__row--{{ d.mau }}" [routerLink]="d.link">{{ d.nhan }}</a>
    }
  </div>
</section>
